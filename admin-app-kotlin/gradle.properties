org.gradle.jvmargs=-Xmx820m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=false

# Mesin build ini RAM-nya 2 GB tanpa swap. Tanpa dua baris di bawah, tahap
# "strip libraries" memakai ratusan MB dan daemon Gradle dibunuh sistem.

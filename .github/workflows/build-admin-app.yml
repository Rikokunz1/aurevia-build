name: Build Aurevia Admin APK (Kotlin/Compose)

# Batch 240 — APK admin Kotlin/Compose asli (tanpa WebView).
#
# Sumbernya: admin-app-kotlin/ (satu MainActivity.kt berisi panel penuh:
# beranda, pengguna, efek premium, room, siaran, plus pemilih role kustom).
# Paket com.aurevia.admin — sama dengan rilis admin sebelumnya.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi tampilan (mis. 2.2.0)"
        required: false
        default: "2.2.0"
      version_code:
        description: "versionCode"
        required: false
        default: "26"

permissions:
  contents: read

concurrency:
  group: admin-app-build
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Aurevia Admin (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms"

      - name: Sumber wajib ada
        run: |
          set -e
          test -f admin-app-kotlin/app/src/main/AndroidManifest.xml
          test -f admin-app-kotlin/app/src/main/kotlin/com/aurevia/admin/MainActivity.kt
          # Panel harus memuat efek premium & role kustom (batch 240).
          grep -q 'EfekPremium' admin-app-kotlin/app/src/main/kotlin/com/aurevia/admin/MainActivity.kt
          grep -q 'RoleBaku' admin-app-kotlin/app/src/main/kotlin/com/aurevia/admin/MainActivity.kt
          grep -q '/v1/admin/effects' admin-app-kotlin/app/src/main/kotlin/com/aurevia/admin/MainActivity.kt
          # Tidak boleh ada WebView lagi.
          if grep -q 'WebView' admin-app-kotlin/app/src/main/kotlin/com/aurevia/admin/MainActivity.kt; then
            echo "MASIH ADA WebView"; exit 1
          fi
          echo "sumber bersih: Compose, tanpa WebView"

      - name: Tulis versi
        run: |
          set -e
          python3 - "${{ inputs.version_code }}" "${{ inputs.version_name }}" <<'PY'
          import re, sys, pathlib
          vc, vn = sys.argv[1], sys.argv[2]
          p = pathlib.Path('admin-app-kotlin/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode = \d+', f'versionCode = {vc}', s)
          s = re.sub(r'versionName = "[^"]*"', f'versionName = "{vn}"', s)
          p.write_text(s)
          print('versi ->', vc, vn)
          PY

      - name: Build APK
        working-directory: admin-app-kotlin
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --console=plain --no-daemon :app:assembleRelease
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"

      - name: Verifikasi APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt2" dump badging "$APK" | head -4
          sha256sum "$APK" | tee admin-sha256.txt
          # Panel harus benar-benar ada di dex (bukan shell kosong).
          python3 - "$APK" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          dex = b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
          wajib = [b'Aurevia Admin', b'/v1/admin/effects', b'/v1/admin/overview',
                   b'Role kustom', b'Hologram', b'aurevia.rixxstore.my.id']
          hilang = [w.decode() for w in wajib if w not in dex]
          print("isi panel:", "ok" if not hilang else "HILANG " + str(hilang))
          sys.exit(1 if hilang else 0)
          PY

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: aurevia-admin-apk
          path: |
            ${{ env.APK }}
            admin-sha256.txt
          if-no-files-found: error

name: Build Aurevia Admin APK

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: "Catatan build (opsional)"
        required: false
        default: "kotlin-compose"

permissions:
  contents: read

concurrency:
  group: admin-app-build
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Aurevia Admin (Kotlin/Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDU="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDU" ] || SDU=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1) || true
          if [ -n "$SDU" ] && [ -x "$SDU" ]; then
            yes | "$SDU" --licenses > /dev/null 2>&1 || true
            "$SDU" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms"

      - name: Build release APK
        working-directory: admin-app-kotlin
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verifikasi APK
        run: |
          set -e
          APK=$(find admin-app-kotlin/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"
          sha256sum "$APK" | tee admin-sha256.txt
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" | head -8 | tee admin-badging.txt || true
          "$BT/apksigner" verify --print-certs "$APK" | head -6 | tee admin-signature.txt || true

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: aurevia-admin-apk
          path: |
            ${{ env.APK }}
            admin-sha256.txt
            admin-badging.txt
            admin-signature.txt
          if-no-files-found: error

name: Build Aurevia Admin APK (panel HTML)

# Batch 239 — APK admin dirakit dari admin-app/ (panel HTML + shell WebView Java).
#
# Panel Compose (admin-app-kotlin) tidak lengkap di repo ini: hanya berkas Gradle
# tanpa satu pun sumber .kt, jadi task :app:assembleRelease tidak punya apa pun
# untuk dikompilasi. Yang lengkap dan bisa dibangun adalah admin-app/: satu
# admin.html + MainActivity.java + res/. Workflow ini merakit itu.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi tampilan (mis. 2.1.0)"
        required: false
        default: "2.1.0"
      version_code:
        description: "versionCode"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: admin-app-build
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Aurevia Admin (HTML panel)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms"

      - name: Panel & sumber wajib ada
        run: |
          set -e
          for f in admin-app/AndroidManifest.xml admin-app/MainActivity.java admin-app/admin.html; do
            test -f "$f" || { echo "HILANG: $f"; exit 1; }
            echo "ok $f ($(wc -c < "$f") byte)"
          done
          # Panel harus memuat pemilih role & efek premium (batch 239).
          grep -q 'id="roleMask"' admin-app/admin.html
          grep -q 'id="effectMask"' admin-app/admin.html
          grep -q '/v1/admin/effects' admin-app/admin.html
          echo "panel memuat pemilih role kustom & efek premium"

      - name: Tulis versi ke manifest
        run: |
          set -e
          python3 - "${{ inputs.version_code }}" "${{ inputs.version_name }}" <<'PY'
          import re, sys, pathlib
          vc, vn = sys.argv[1], sys.argv[2]
          p = pathlib.Path('admin-app/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:versionCode="[^"]*"', f'android:versionCode="{vc}"', s)
          s = re.sub(r'android:versionName="[^"]*"', f'android:versionName="{vn}"', s)
          p.write_text(s)
          print('manifest ->', vc, vn)
          PY

      - name: Rakit APK
        run: |
          set -e
          SDK="$ANDROID_HOME"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          PLATFORM=$(ls -d "$SDK"/platforms/android-35)
          echo "BT=$BT"; echo "PLATFORM=$PLATFORM"
          KERJA="$RUNNER_TEMP/admin"
          rm -rf "$KERJA"; mkdir -p "$KERJA"/{assets,res,classes,gen,dex}
          cp admin-app/admin.html "$KERJA/assets/admin.html"
          cp -r admin-app/res/* "$KERJA/res/"
          "$BT/aapt2" compile --dir "$KERJA/res" -o "$KERJA/res.zip"
          "$BT/aapt2" link -o "$KERJA/base.apk" -I "$PLATFORM/android.jar" \
            --manifest admin-app/AndroidManifest.xml -R "$KERJA/res.zip" \
            --java "$KERJA/gen" --auto-add-overlay
          find "$KERJA/gen" -name '*.java' > "$KERJA/sumber.txt"
          echo admin-app/MainActivity.java >> "$KERJA/sumber.txt"
          # -bootclasspath tidak diizinkan bersama target 17; cukup -classpath.
          javac -encoding UTF-8 -source 17 -target 17 -classpath "$PLATFORM/android.jar" \
            -d "$KERJA/classes" @"$KERJA/sumber.txt"
          find "$KERJA/classes" -name '*.class' > "$KERJA/kelas.txt"
          "$BT/d8" --lib "$PLATFORM/android.jar" --min-api 26 --output "$KERJA/dex" @"$KERJA/kelas.txt"
          cp "$KERJA/base.apk" "$KERJA/unsigned.apk"
          mkdir -p "$KERJA/zip/assets"
          cp "$KERJA/assets/admin.html" "$KERJA/zip/assets/"
          cp "$KERJA/dex/classes.dex" "$KERJA/zip/"
          (cd "$KERJA/zip" && zip -q -r ../unsigned.apk assets classes.dex)
          "$BT/zipalign" -f 4 "$KERJA/unsigned.apk" "$KERJA/aligned.apk"
          keytool -genkeypair -keystore "$KERJA/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          OUT="Aurevia-Admin-v${{ inputs.version_name }}.apk"
          "$BT/apksigner" sign --ks "$KERJA/debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey --out "$OUT" "$KERJA/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          "$BT/aapt2" dump badging "$OUT" | head -6
          sha256sum "$OUT" | tee admin-sha256.txt
          ls -l "$OUT"

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: aurevia-admin-apk
          path: |
            Aurevia-Admin-v${{ inputs.version_name }}.apk
            admin-sha256.txt
          if-no-files-found: error

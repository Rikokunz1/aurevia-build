name: Uji jalan (emulator, crash check)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL APK"
        required: true
      api_level:
        description: "API level"
        required: false
        default: "35"

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ambil APK
        run: |
          set -e
          curl -fL --retry 3 --max-time 900 -o /tmp/candidate.apk "${{ inputs.apk_url }}"
          sha256sum /tmp/candidate.apk
      - name: Enable KVM
        run: |
          test -e /dev/kvm && sudo chmod a+rw /dev/kvm || true
      - name: Pasang + tembus ke layar utama
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            adb install -r -d /tmp/candidate.apk 2>&1 | tee /tmp/install.txt
            # kasih semua izin supaya tidak mentok di dialog
            adb shell pm grant app.aurevia.music android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            adb shell pm grant app.aurevia.music android.permission.READ_MEDIA_AUDIO 2>/dev/null || true
            adb shell pm grant app.aurevia.music android.permission.READ_MEDIA_VIDEO 2>/dev/null || true
            adb logcat -c
            adb shell am start -n app.aurevia.music/com.metrolist.music.MainActivity
            sleep 20
            adb shell input keyevent 66 2>/dev/null
            adb shell input tap 540 1400 2>/dev/null
            sleep 4
            adb shell input keyevent 66 2>/dev/null
            adb shell input tap 540 1400 2>/dev/null
            sleep 6
            adb shell am start -n app.aurevia.music/com.metrolist.music.MainActivity >/dev/null 2>&1
            sleep 15
            echo "===== PROSES HIDUP? ====="
            adb shell pidof app.aurevia.music || echo "TIDAK ADA PROSES (crash/keluar)"
            echo "===== LAYAR SEKARANG ====="
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | head -2
            echo "===== SEMUA CRASH DI LOGCAT ====="
            adb logcat -d | grep -iE "FATAL EXCEPTION|ArrayIndexOutOfBounds|IncompatibleClassChange|AndroidRuntime|Process app.aurevia.music.*died|Force finishing" | tail -60 | tee /tmp/crash.txt
            echo "===== JUMLAH BARIS CRASH ====="
            wc -l < /tmp/crash.txt
            adb shell screencap -p /sdcard/ss.png 2>/dev/null
            adb pull /sdcard/ss.png /tmp/ss.png 2>/dev/null && ls -l /tmp/ss.png
      - name: Simpan tangkapan layar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tangkapan-layar
          path: /tmp/ss.png
          if-no-files-found: ignore
      - name: Ringkasan
        if: always()
        run: |
          echo "=== install ==="; cat /tmp/install.txt || true
          echo "=== crash ==="; cat /tmp/crash.txt || true

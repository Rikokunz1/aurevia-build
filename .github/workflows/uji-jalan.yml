name: Uji jalan (emulator, crash check)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "URL APK"
        required: true
      api_level:
        description: "API level"
        required: false
        default: "35"

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ambil APK
        run: |
          set -e
          curl -fL --retry 3 --max-time 900 -o /tmp/candidate.apk "${{ inputs.apk_url }}"
          sha256sum /tmp/candidate.apk
      - name: Enable KVM
        run: |
          test -e /dev/kvm && sudo chmod a+rw /dev/kvm || true
      - name: Pasang + jalankan
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            adb install -r -d /tmp/candidate.apk 2>&1 | tee /tmp/install.txt
            adb logcat -c
            adb shell am start -n app.aurevia.music/com.metrolist.music.MainActivity 2>&1 | tee /tmp/start.txt
            sleep 25
            echo "===== PROSES HIDUP? ====="
            adb shell pidof app.aurevia.music || echo "TIDAK ADA PROSES (crash/keluar)"
            echo "===== FATAL / EXCEPTION ====="
            adb logcat -d | grep -iE "FATAL|IncompatibleClassChange|ActivityManager: Process app.aurevia|AndroidRuntime" | tail -60 | tee /tmp/crash.txt
            echo "===== apakah Activity tampil ====="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -3
      - name: Ringkasan
        if: always()
        run: |
          echo "=== install ==="; cat /tmp/install.txt || true
          echo "=== start ==="; cat /tmp/start.txt || true
          echo "=== crash ==="; cat /tmp/crash.txt || true

name: secret probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cek
        env:
          K1: ${{ secrets.KEYSTORE_B }}
          K2: ${{ secrets.KEY_ALIAS }}
          K3: ${{ secrets.KEY_PASSWORD }}
          K4: ${{ secrets.STORE_PASSWORD }}
          P1: ${{ secrets.PTERO_BUILDER_TOKEN }}
          P2: ${{ secrets.PTERO_BACKEND_TOKEN }}
          P3: ${{ secrets.PTERO_TOKEN }}
          P4: ${{ secrets.PTERO_APITOKEN }}
        run: |
          for v in K1 K2 K3 K4 P1 P2 P3 P4; do
            eval "val=\$$v"
            if [ -n "$val" ]; then echo "$v SET len=${#val}"; else echo "$v EMPTY"; fi
          done

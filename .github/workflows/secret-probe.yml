name: secret probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cek
        env:
          A: ${{ secrets.PTERO_BUILDER_TOKEN }}
          B: ${{ secrets.PTERO_BACKEND_TOKEN }}
          C: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          D: ${{ secrets.PTERO_TOKEN }}
        run: |
          [ -n "$A" ] && echo "PTERO_BUILDER_TOKEN: set (${#A})" || echo "PTERO_BUILDER_TOKEN: EMPTY"
          [ -n "$B" ] && echo "PTERO_BACKEND_TOKEN: set (${#B})" || echo "PTERO_BACKEND_TOKEN: EMPTY"
          [ -n "$C" ] && echo "RELEASE_KEYSTORE_BASE64: set" || echo "RELEASE_KEYSTORE_BASE64: EMPTY"
          [ -n "$D" ] && echo "PTERO_TOKEN: set (${#D})" || echo "PTERO_TOKEN: EMPTY"

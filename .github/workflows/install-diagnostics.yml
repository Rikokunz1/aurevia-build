name: APK install diagnostics

on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Build run containing the APK to test
        required: true
        default: '43737456491'
      fixture_tag:
        description: Private release containing the baseline APK
        required: true
        default: install-fixtures
      api_levels:
        description: JSON array of Android API levels
        required: true
        default: '[30,33,35]'

permissions:
  actions: read
  contents: read

jobs:
  install-test:
    name: Install + upgrade API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.api_levels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          FIXTURE_TAG: ${{ inputs.fixture_tag }}
        run: |
          set -euo pipefail
          mkdir -p inputs/candidate inputs/baseline reports
          gh run download "$ARTIFACT_RUN" --name aurevia-apk --dir inputs/candidate
          gh release download "$FIXTURE_TAG" --pattern '*.apk' --dir inputs/baseline
          sha256sum inputs/*/*.apk | tee reports/input-sha256.txt
      - name: Free ephemeral runner disk for emulator userdata
        run: |
          set -euo pipefail
          # API33's system image still needs a ~7.4GB initial userdata image even
          # with disk-size=2048M. Delete ONLY unused tools on this disposable CI VM.
          df -h "$HOME"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h "$HOME"
          python3 -c 'import os, shutil; free=shutil.disk_usage(os.environ["HOME"]).free; print("CI emulator free disk: %.2f GiB" % (free/1024**3)); assert free >= 12*1024**3, "Insufficient CI disk; abort before boot/install, not an APK rejection"'
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
      - name: Real install and upgrade tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/install-diagnostics.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-report-api-${{ matrix.api }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

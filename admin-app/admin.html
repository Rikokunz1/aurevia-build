<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Aurevia Admin</title>
<style>
  :root{
    --bg:#0b0b10; --card:#15151d; --card2:#1b1b25; --line:#262633;
    --text:#f3f3f7; --muted:#9a9aab; --coral:#fa2d48; --violet:#7b5cff;
    --ok:#2bd46e; --warn:#ffb020; --bad:#ff4d5e;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%,#1a1230 0%,var(--bg) 55%) fixed;
    color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 90px);
  }
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}
  input,select,textarea{
    width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:12px 12px;font-size:15px;outline:none
  }
  input:focus,select:focus,textarea:focus{border-color:var(--violet)}
  textarea{min-height:92px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
  button{
    appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:650;
    background:linear-gradient(135deg,var(--coral),var(--violet));color:#fff;width:100%
  }
  button:active{transform:scale(.985)}
  button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  button.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
  button.danger{background:#33131a;color:#ff8b96;border:1px solid #5a1f2a}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--muted)}
  .chip.ok{color:var(--ok);border-color:#1d4a2f}
  .chip.warn{color:var(--warn);border-color:#4a3a14}
  .chip.bad{color:var(--bad);border-color:#4a1d24}
  .stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat .card{padding:14px}
  .stat .n{font-size:24px;font-weight:750;letter-spacing:-.5px}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  nav{
    position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);
    display:flex;gap:6px;background:rgba(21,21,29,.92);backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:20px;padding:6px;z-index:20
  }
  nav button{background:transparent;color:var(--muted);padding:11px 6px;border-radius:14px;font-size:11.5px;font-weight:600}
  nav button.on{background:linear-gradient(135deg,rgba(250,45,72,.22),rgba(123,92,255,.22));color:var(--text)}
  .user{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card2);margin-bottom:10px;align-items:flex-start}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--violet));
    display:grid;place-items:center;font-weight:700;flex:0 0 auto;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .name{font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
  .toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 84px);
    background:#1f1f2b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;
    opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:none}
  .toast.ok{border-color:#1d4a2f}.toast.err{border-color:#4a1d24}
  .hidden{display:none!important}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .ghosttext{color:var(--muted);font-size:12.5px}
  .pill{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.owner{color:#ffd166;border-color:#4a3a14}.pill.admin{color:#7bdcff;border-color:#14404a}
  .pill.developer{color:#c9b6ff;border-color:#33265c}
</style>
</head>
<body>

<header class="row" style="margin-bottom:14px">
  <div class="grow">
    <h1>Aurevia Admin</h1>
    <div class="sub" id="whoami">Belum masuk</div>
  </div>
  <button class="ghost sm" id="logoutBtn" style="display:none">Keluar</button>
</header>

<!-- LOGIN -->
<section id="loginView" class="card">
  <div style="font-weight:700;margin-bottom:2px">Masuk sebagai staff</div>
  <div class="ghosttext">Hanya akun owner / developer yang bisa memakai panel ini.</div>
  <label>Username</label>
  <input id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username">
  <label>Password</label>
  <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
  <div style="height:16px"></div>
  <button id="loginBtn">Masuk</button>
</section>

<!-- DASHBOARD -->
<section id="dashView" class="hidden">
  <div class="stat" id="statGrid"></div>
  <div class="card" style="margin-top:12px">
    <div class="row"><div class="grow"><b>Status server</b></div><span id="pushChip" class="chip">memuat…</span></div>
    <div class="sep"></div>
    <div class="ghosttext" id="serverMeta">—</div>
  </div>
  <div style="height:12px"></div>
  <button class="ghost" id="refreshDash">Muat ulang</button>
</section>

<!-- NOTIFIKASI -->
<section id="pushView" class="hidden">
  <div class="card">
    <div style="font-weight:700">Kirim notifikasi</div>
    <div class="ghosttext">Notifikasi muncul di HP penerima lewat FCM resmi.</div>
    <label>Judul</label>
    <input id="pushTitle" maxlength="80" placeholder="Aurevia">
    <label>Isi</label>
    <textarea id="pushBody" maxlength="300" placeholder="Ada lagu baru di Aurevia…"></textarea>
    <label>Penerima</label>
    <select id="pushAudience">
      <option value="all">Semua pengguna</option>
      <option value="verified">Hanya yang berv erifikasi/berbadge</option>
      <option value="staff">Hanya staff</option>
      <option value="user">Satu pengguna</option>
    </select>
    <div id="pushUserWrap" class="hidden">
      <label>Username tujuan</label>
      <input id="pushUsername" autocapitalize="none" spellcheck="false" placeholder="username">
    </div>
    <div style="height:16px"></div>
    <button id="pushSend">Kirim sekarang</button>
    <div class="sep"></div>
    <div class="ghosttext">Perangkat terdaftar: <b id="deviceCount">—</b></div>
  </div>
</section>

<!-- PENGGUNA -->
<section id="usersView" class="hidden">
  <div class="card" style="margin-bottom:12px">
    <div class="row">
      <input id="userQuery" class="grow" placeholder="Cari username / nama" autocapitalize="none" spellcheck="false">
      <button class="sm ghost" id="userSearch">Cari</button>
    </div>
    <div class="row" style="margin-top:10px">
      <select id="userRole" class="grow">
        <option value="">Semua role</option>
        <option value="developer">Developer</option>
        <option value="owner">Owner</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>
  </div>
  <div id="userList"></div>
</section>

<!-- SIARAN -->
<section id="bcView" class="hidden">
  <div class="card">
    <div style="font-weight:700">Siaran pesan (DM)</div>
    <div class="ghosttext">Masuk ke kotak masuk setiap akun, bukan push.</div>
    <label>Pesan</label>
    <textarea id="bcText" maxlength="500" placeholder="Pengumuman…"></textarea>
    <div style="height:16px"></div>
    <button id="bcSend">Kirim siaran</button>
  </div>
</section>

<!-- ROOM -->
<section id="roomView" class="hidden">
  <div class="row" style="margin-bottom:12px">
    <div class="grow"><b>Room Live aktif</b></div>
    <button class="sm ghost" id="roomRefresh">Muat ulang</button>
  </div>
  <div id="roomList"></div>
</section>

<nav>
  <button data-view="dashView" class="on">Ringkasan</button>
  <button data-view="pushView">Notifikasi</button>
  <button data-view="usersView">Pengguna</button>
  <button data-view="bcView">Siaran</button>
  <button data-view="roomView">Room</button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var BASE = 'https://aurevia.rixxstore.my.id';
  var token = localStorage.getItem('aurevia_admin_token') || '';
  var me = null;

  var $ = function(id){ return document.getElementById(id); };
  function toast(msg, kind){
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.className = 'toast'; }, 3200);
  }
  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function api(path, opts){
    opts = opts || {};
    var headers = { 'Accept':'application/json' };
    if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (opts.adminKey) headers['x-admin-key'] = opts.adminKey;
    return fetch(BASE + path, {
      method: opts.method || (opts.body !== undefined ? 'POST' : 'GET'),
      headers: headers,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body)
    }).then(function(r){
      return r.text().then(function(text){
        var data = {};
        try { data = text ? JSON.parse(text) : {}; } catch(e){ data = { raw: text }; }
        if (!r.ok) { var err = new Error(data.error || ('HTTP ' + r.status)); err.status = r.status; err.data = data; throw err; }
        return data;
      });
    });
  }
  function show(view){
    ['dashView','pushView','usersView','bcView','roomView'].forEach(function(id){
      $(id).classList.toggle('hidden', id !== view);
    });
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-view') === view);
    });
    if (view === 'dashView') loadDash();
    if (view === 'pushView') loadDevices();
    if (view === 'usersView' && !$('userList').dataset.loaded) searchUsers();
    if (view === 'roomView') loadRooms();
  }
  function signedIn(){
    $('loginView').classList.toggle('hidden', !!me);
    $('logoutBtn').style.display = me ? '' : 'none';
    $('whoami').textContent = me ? (me.username || me.name) + ' · ' + (me.role || 'user') : 'Belum masuk';
    if (me) show('dashView');
  }

  $('loginBtn').onclick = function(){
    var u = $('loginUser').value.trim();
    var p = $('loginPass').value;
    if (!u || !p) { toast('Isi username dan password', 'err'); return; }
    api('/v1/auth/login', { body: { username: u, password: p } }).then(function(res){
      token = res.token || (res.session && res.session.token) || '';
      me = res.user || null;
      if (!token) throw new Error('Token tidak diterima');
      if (!me || !(me.role === 'owner' || me.role === 'admin' || me.role === 'developer')) {
        throw Object.assign(new Error('Akun ini bukan owner/developer'), { status: 403 });
      }
      localStorage.setItem('aurevia_admin_token', token);
      localStorage.setItem('aurevia_admin_user', JSON.stringify(me));
      $('loginPass').value = '';
      toast('Masuk sebagai ' + (me.username || me.name), 'ok');
      signedIn();
    }).catch(function(e){ toast(e.message || 'Gagal masuk', 'err'); });
  };

  $('logoutBtn').onclick = function(){
    token = ''; me = null;
    localStorage.removeItem('aurevia_admin_token');
    localStorage.removeItem('aurevia_admin_user');
    signedIn();
  };

  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){
    b.onclick = function(){ show(b.getAttribute('data-view')); };
  });

  function loadDash(){
    api('/v1/admin/overview').then(function(d){
      $('statGrid').innerHTML = [
        ['Pengguna', d.users], ['Staff', d.staff], ['Bercentang', d.checked], ['Perangkat', d.devices],
        ['Room Live', d.rooms], ['Pendengar', d.listeners]
      ].map(function(row){
        return '<div class="card"><div class="n">' + esc(row[1]) + '</div><div class="l">' + esc(row[0]) + '</div></div>';
      }).join('');
      var ok = d.push === 'configured';
      $('pushChip').className = 'chip ' + (ok ? 'ok' : 'bad');
      $('pushChip').textContent = ok ? 'Push siap' : 'Push belum aktif';
      $('serverMeta').textContent = 'Perangkat aktif 90 hari: ' + d.devicesActive + ' · Waktu server: ' +
        new Date(d.serverTime || Date.now()).toLocaleString('id-ID');
    }).catch(function(e){
      if (e.status === 401 || e.status === 403) { logoutLocal(); return; }
      toast('Gagal memuat ringkasan: ' + e.message, 'err');
    });
  }
  function loadDevices(){
    api('/v1/admin/devices').then(function(d){
      $('deviceCount').textContent = d.total;
    }).catch(function(){ $('deviceCount').textContent = '—'; });
  }
  $('refreshDash').onclick = loadDash;

  $('pushAudience').onchange = function(){
    $('pushUserWrap').classList.toggle('hidden', this.value !== 'user');
  };
  $('pushSend').onclick = function(){
    var body = $('pushBody').value.trim();
    if (!body) { toast('Isi notifikasi dulu', 'err'); return; }
    var payload = {
      title: $('pushTitle').value.trim() || 'Aurevia',
      body: body,
      audience: $('pushAudience').value
    };
    if (payload.audience === 'user') {
      var uname = $('pushUsername').value.trim();
      if (!uname) { toast('Username tujuan belum diisi', 'err'); return; }
      payload.username = uname;
    }
    $('pushSend').disabled = true;
    api('/v1/admin/push', { body: payload }).then(function(res){
      toast('Terkirim ke ' + (res.delivered || 0) + ' perangkat' + (res.failed ? ' (' + res.failed + ' gagal)' : ''), 'ok');
    }).catch(function(e){
      if (e.status === 404) toast('Server belum punya endpoint kirim notifikasi. Deploy modul admin dulu.', 'err');
      else if (e.status === 501) toast('Server belum mendukung notifikasi admin.', 'err');
      else toast(e.message || 'Gagal mengirim', 'err');
    }).finally(function(){ $('pushSend').disabled = false; });
  };

  function searchUsers(){
    var q = $('userQuery').value.trim();
    var role = $('userRole').value;
    var qs = [];
    if (q) qs.push('q=' + encodeURIComponent(q));
    if (role) qs.push('role=' + encodeURIComponent(role));
    api('/v1/admin/users' + (qs.length ? '?' + qs.join('&') : '')).then(function(d){
      $('userList').dataset.loaded = '1';
      if (!d.users.length) { $('userList').innerHTML = '<div class="ghosttext">Tidak ada pengguna.</div>'; return; }
      $('userList').innerHTML = d.users.map(function(u){
        var initial = esc((u.name || u.username || '?').trim().charAt(0).toUpperCase());
        var avatar = u.photo ? '<img src="' + esc(u.photo.indexOf('http') === 0 ? u.photo : BASE + u.photo) + '" alt="">' : initial;
        return '<div class="user" data-u="' + esc(u.username) + '">' +
          '<div class="avatar">' + avatar + '</div>' +
          '<div class="grow">' +
            '<div class="name">' + esc(u.name || u.username) + ' <span class="pill ' + esc(u.role) + '">' + esc(u.role) + '</span></div>' +
            '<div class="mono">@' + esc(u.username) + (u.verified ? ' · ✔ terverifikasi' : '') + (u.badge ? ' · badge ' + esc(u.badge) : '') + '</div>' +
            '<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px">' +
              '<button class="sm ghost" data-act="role" data-u="' + esc(u.username) + '" data-role="' + esc(u.role) + '">Ubah role</button>' +
              '<button class="sm ' + (u.verified ? 'danger' : 'ghost') + '" data-act="verify" data-u="' + esc(u.username) + '" data-verified="' + (u.verified ? '1' : '0') + '">' + (u.verified ? 'Hapus centang' : 'Beri centang') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }).catch(function(e){
      if (e.status === 401 || e.status === 403) { logoutLocal(); return; }
      toast('Gagal memuat pengguna: ' + e.message, 'err');
    });
  }
  $('userSearch').onclick = searchUsers;
  $('userQuery').addEventListener('keydown', function(e){ if (e.key === 'Enter') searchUsers(); });
  $('userRole').onchange = searchUsers;

  $('userList').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var username = btn.getAttribute('data-u');
    if (btn.getAttribute('data-act') === 'verify') {
      var next = btn.getAttribute('data-verified') !== '1';
      api('/v1/admin/role', { body: { username: username, verified: next } }).then(function(){
        toast(next ? 'Centang diberikan ke @' + username : 'Centang @' + username + ' dihapus', 'ok');
        searchUsers();
      }).catch(function(err){ toast(err.message || 'Gagal', 'err'); });
    }
    if (btn.getAttribute('data-act') === 'role') {
      var current = btn.getAttribute('data-role');
      var pick = prompt('Role baru untuk @' + username + ' (user / admin / owner / developer):', current);
      if (!pick) return;
      api('/v1/admin/role', { body: { username: username, role: pick.trim() } }).then(function(){
        toast('Role @' + username + ' → ' + pick.trim(), 'ok');
        searchUsers();
      }).catch(function(err){ toast(err.message || 'Gagal', 'err'); });
    }
  });

  $('bcSend').onclick = function(){
    var text = $('bcText').value.trim();
    if (!text) { toast('Pesan masih kosong', 'err'); return; }
    api('/v1/admin/broadcast', { body: { text: text } }).then(function(res){
      toast('Siaran terkirim ke ' + (res.sent || 0) + ' akun', 'ok');
      $('bcText').value = '';
    }).catch(function(e){ toast(e.message || 'Gagal mengirim siaran', 'err'); });
  };

  function loadRooms(){
    api('/v1/admin/rooms').then(function(d){
      if (!d.rooms.length) { $('roomList').innerHTML = '<div class="ghosttext">Belum ada room Live aktif.</div>'; return; }
      $('roomList').innerHTML = d.rooms.map(function(r){
        return '<div class="user"><div class="avatar">' + esc((r.name || 'R').charAt(0).toUpperCase()) + '</div>' +
          '<div class="grow"><div class="name">' + esc(r.name) + (r.hasPassword ? ' 🔒' : '') + '</div>' +
          '<div class="mono">ID ' + esc(r.id) + ' · host ' + esc(r.host || r.hostId) + ' · ' + esc(r.listeners) + ' pendengar</div></div></div>';
      }).join('');
    }).catch(function(e){ toast('Gagal memuat room: ' + e.message, 'err'); });
  }
  $('roomRefresh').onclick = loadRooms;

  function logoutLocal(){
    token = ''; me = null;
    localStorage.removeItem('aurevia_admin_token');
    localStorage.removeItem('aurevia_admin_user');
    signedIn();
    toast('Sesi berakhir, silakan masuk lagi', 'err');
  }

  // Restore a previous session, then verify it still works.
  try { me = JSON.parse(localStorage.getItem('aurevia_admin_user') || 'null'); } catch(e){ me = null; }
  if (token) {
    api('/v1/admin/overview').then(function(){ signedIn(); }).catch(function(){ logoutLocal(); });
  } else {
    signedIn();
  }
})();
</script>
</body>
</html>
